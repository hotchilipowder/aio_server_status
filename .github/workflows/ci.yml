name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -q
      - name: Exercise real OpenSSH and the Linux probe
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          bash scripts/ssh_smoke.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
        working-directory: fe
      - run: npm run format:check
        working-directory: fe
      - run: npm test
        working-directory: fe
      - run: npm run build
        working-directory: fe
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: fe/dist/
          if-no-files-found: error

  package:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: fe/dist/
      - run: uv sync --frozen --no-dev --group build
      - run: uv run --no-sync python scripts/bundle_frontend.py
      - run: uv build
      - run: uv run --no-sync twine check dist/*.whl dist/*.tar.gz
      - name: Test wheel and source distribution outside the checkout
        run: |
          wheel=$(realpath dist/*.whl)
          source_package=$(realpath dist/*.tar.gz)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
          uv run --isolated --no-project --with "$source_package" python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
      - name: Prepare bundled Release assets and checksums
        run: uv run --no-sync python scripts/prepare_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --only-group docs
      - run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html
