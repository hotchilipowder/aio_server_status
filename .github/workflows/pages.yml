name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: uv sync --frozen --only-group docs
      - name: Build Sphinx HTML documentation
        run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html
      - run: npm ci
        working-directory: fe
      - run: npm test
        working-directory: fe
      - run: npm run build
        working-directory: fe
        env:
          VITE_DEMO: 'true'
      - name: Add the synthetic dashboard demo
        run: cp -r fe/dist docs/_build/html/demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Sphinx documentation and demo
        id: deployment
        uses: actions/deploy-pages@v4
